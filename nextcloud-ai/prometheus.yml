global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'mariadb-internals'
    static_configs:
      - targets: ['mysqld-exporter:9104']

  - job_name: 'redis-internals'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'http_latency'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://app:80']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox-exporter:9115